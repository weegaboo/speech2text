[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech2text-local"
version = "0.1.0"
description = "Offline CPU transcription of audio files and folders on macOS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2,<3",
  "rich>=13,<15",
  "silero-vad>=6.2,<7",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "gigaam @ git+https://github.com/salute-developers/GigaAM.git@7447938d791c4f3e643386ee22c33777004293a5",
]

[project.scripts]
speech2text = "speech2text.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/speech2text"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
